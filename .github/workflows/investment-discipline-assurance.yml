name: Investment Discipline Machine Assurance

on:
  push:
    branches:
      - main
      - "codex/investment-assurance-*"
    paths:
      - "MyBrain/projects/investment-discipline-system/**"
      - ".github/workflows/investment-discipline-assurance.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: investment-discipline-assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  machine-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDS_PROJECT: MyBrain/projects/investment-discipline-system
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use the frozen Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the frozen static checker
        run: python -m pip install --disable-pip-version-check ruff==0.15.17

      - name: Execute machine assurance
        working-directory: ${{ env.IDS_PROJECT }}
        run: >-
          python scripts/run_assurance_ci.py
          --output evidence/ci/assurance-manifest.json

      - name: Attest the assurance manifest
        if: >-
          ${{ always() &&
          hashFiles('MyBrain/projects/investment-discipline-system/evidence/ci/assurance-manifest.json')
          != '' }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: >-
            ${{ env.IDS_PROJECT }}/evidence/ci/assurance-manifest.json

      - name: Upload the assurance manifest
        if: >-
          ${{ always() &&
          hashFiles('MyBrain/projects/investment-discipline-system/evidence/ci/assurance-manifest.json')
          != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: investment-discipline-assurance-manifest
          path: >-
            ${{ env.IDS_PROJECT }}/evidence/ci/assurance-manifest.json
          if-no-files-found: error
          retention-days: 90
