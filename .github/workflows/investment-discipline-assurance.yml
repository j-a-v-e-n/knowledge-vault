name: Investment Discipline Machine Assurance

on:
  push:
    branches:
      - main
      - "codex/investment-assurance-*"
    paths:
      - "MyBrain/projects/investment-discipline-system/**"
      - ".github/workflows/investment-discipline-assurance.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: investment-discipline-assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  machine-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IDS_PROJECT: MyBrain/projects/investment-discipline-system
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Normalize the trusted public fetch URL
        run: >-
          git remote set-url origin
          https://github.com/j-a-v-e-n/knowledge-vault.git

      - name: Use the frozen Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the frozen static checker
        working-directory: ${{ env.IDS_PROJECT }}
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          --no-deps
          -r governance/requirements-ci.txt

      - name: Execute machine assurance
        working-directory: ${{ env.IDS_PROJECT }}
        run: >-
          python scripts/run_assurance_ci.py
          --output evidence/ci/assurance-manifest.json

      - name: Attest the assurance manifest
        if: >-
          ${{ always() &&
          hashFiles('MyBrain/projects/investment-discipline-system/evidence/ci/assurance-manifest.json')
          != '' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: >-
            ${{ env.IDS_PROJECT }}/evidence/ci/assurance-manifest.json

      - name: Upload the assurance manifest
        if: >-
          ${{ always() &&
          hashFiles('MyBrain/projects/investment-discipline-system/evidence/ci/assurance-manifest.json')
          != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: investment-discipline-assurance-manifest
          path: >-
            ${{ env.IDS_PROJECT }}/evidence/ci/assurance-manifest.json
          if-no-files-found: error
          retention-days: 90
